services:
  db:
    image: postgis/postgis:16-3.5-alpine
    container_name: ptjcc_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: PT_JCC
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./Backend/initdb/init-postgis.sql:/docker-entrypoint-initdb.d/init-postgis.sql

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: ptjcc_pgadmin
    restart: unless-stopped
    depends_on:
      - db
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin

  backend-dev:
    profiles: ["dev"]
    build:
      context: ./Backend
      target: dev
    container_name: ptjcc_backend_dev
    restart: unless-stopped
    depends_on:
      - db
    ports:
      - "3000:3000"
    environment:
      PORT: 3000
      NODE_ENV: development
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_NAME: PT_JCC
    volumes:
      - ./Backend:/app
      - /app/node_modules

volumes:
  pgdata:
  pgadmin_data: